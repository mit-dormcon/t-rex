[project]
name = "t-rex"
version = "2026.0.0"
description = "A Python project that generates a structured format for REX events and an HTML file that can get converted into a booklet"
authors = [
    { name = "Cameron Kleiman", email = "ckleiman@mit.edu" },
    { name = "Diego Temkin", email = "dtemkin@mit.edu" },
]
maintainers = [
    { name = "DormCon Tech Chair", email = "dormcon-tech-chair@mit.edu" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Jinja2 >=3.1.6",
    "markdown>=3.10.3",
    "tzdata>=2026.3",
    "pydantic>=2.13.4",
    "pydantic-extra-types >=2.11.1",
    "openapi-pydantic >=0.5.1",
    "email-validator >=2.3.0",
    "PyYaml >=6.0.3",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "djlint>=1.44.2",
    "types-markdown>=3.10.2",
    "types-PyYAML >=6.0.12",
]

[tool.djlint]
profile = "jinja"
use_gitignore = true
files = ["templates"]

[tool.ruff]
target-version = "py314"
